[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "track1-client"
version = "0.1.0"
description = "AI Inference Engineering learning project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
inference-client = "inference_client.cli:main"
infer-config = "inference_client.config_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
